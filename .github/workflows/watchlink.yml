name: WatchLink APKs

on:
  push:
    paths:
      - "WatchLink/**"
      - ".github/workflows/watchlink.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WatchLink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV" && yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build sample watch face + validation token
        run: |
          if [ -x scripts/build_watchfaces.sh ]; then scripts/build_watchfaces.sh; else echo "no watch face script yet"; fi
      - name: Build phone + watch APKs
        run: ./gradlew --stacktrace :mobile:assembleRelease :wear:assembleRelease
      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/release/*.apk dist/WatchLink-phone.apk 2>/dev/null || true
          cp wear/build/outputs/apk/release/*.apk dist/WatchLink-watch.apk 2>/dev/null || true
          cp -r build/watchfaces/* dist/ 2>/dev/null || true
          ls -la dist
      - name: Show watch face validator output
        if: always()
        run: cat build/watchfaces/watchface-contents.txt build/watchfaces/validator.log 2>/dev/null | tail -n 80 || echo "no validator log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WatchLink-apks
          path: WatchLink/dist/
